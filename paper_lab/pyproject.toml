[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-paper-lab"
version = "0.1.0"
description = "Isolated TradingAgents research and paper simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agents = ["tradingagents @ git+https://github.com/masonwmckay-dotcom/TradingAgents.git@57fda7f0943218ce36fdadffcc305bbe71c5797b"]

[project.scripts]
ta-paper = "ta_paper_lab.cli:main"

[tool.setuptools.packages.find]
include = ["ta_paper_lab*"]
